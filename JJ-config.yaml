# iOS Stash配置文件
# 依据官方规则编制 参考 https://stash.wiki
# 更新日期：2026-09-15
# 配置下载地址：https://raw.githubusercontent.com/sydneygao/JJ-stash-config/main/JJ-config.yaml

# 规则模式：rule（规则） global（全局代理） direct（全局直连）
mode: rule

# 5 个级别：silent / info / warning / error / debug。级别越高日志输出量越大，越倾向于调试，若需要请自行开启。
log-level: info

# DNS
dns:
  # 以下填写的 DNS 服务器将会被用来解析 DNS 服务的域名
  # 仅填写 DNS 服务器的 IP 地址
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - system # 使用 iOS 系统 DNS
  # 支持 UDP / TCP / DoT / DoH 协议的 DNS 服务，可以指明具体的连接端口号。
  # 所有 DNS 请求将会直接发送到服务器，不经过任何代理。
  # Stash 会使用最先获得的解析记录回复 DNS 请求
  
  nameserver:
    # 不建议配置超过 2 个 DNS 服务器，会增加系统功耗，如需要DoH自行设置
    - 223.5.5.5
    - 119.29.29.29
  # - https://doh.pub/dns-query
  # - https://dns.alidns.com/dns-query
  # - system # 使用系统 DNS

  # 对部分域名使用单独的 DNS 服务器
  nameserver-policy:
    'www.baidu.com': 114.114.114.114
    '+.proton.me': 1.1.1.1

  # 在以下列表的域名将不会被解析为 fake ip，这些域名相关的解析请求将会返回它们真实的 IP 地址
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.market.xiaomi.com'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'  

    # 小米
    - '+.mi.com'
    - '+.xiaomi.com'
    - '+.xiaomi.net'
    - '+.miui.com'
    
    # Google Voices
    - 'lens.l.google.com'
 
    # Nintendo Switch
    - '*.n.n.srv.nintendo.net'
 
    # PlayStation
    - '+.stun.playstation.net'
 
    # XBox
    - 'xbox.*.*.microsoft.com'
    - '*.*.xboxlive.com'
 
    # Microsoft
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'

# 远程代理集
proxy-providers:
  Airport1:
    url: "https://"   #替换为机场订阅地址
    interval: 43200
    path: ./providers/Airport1.yaml

# 策略组
proxy-groups:
  - {name: 默认代理, type: fallback, proxies: [香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点]}
  - {name: Google, type: select, proxies: [默认代理, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 手动选择, DIRECT]}
  - {name: Ai, type: select, proxies: [默认代理, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 手动选择, DIRECT]}
  - {name: Apple, type: select, proxies: [DIRECT, 默认代理, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 手动选择]}
  - {name: Social, type: select, proxies: [默认代理, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 手动选择, DIRECT]}
  - {name: Microsoft, type: select, proxies: [DIRECT, 默认代理, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 手动选择]}
  - {name: Games, type: select, proxies: [默认代理, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 手动选择, DIRECT]}
  - {name: NETFLIX, type: select, proxies: [默认代理, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 手动选择, DIRECT]}
  - {name: Spotify, type: select, proxies: [默认代理, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 手动选择, DIRECT}
  - {name: PayPal, type: select, proxies: [默认代理, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 手动选择, DIRECT]}
  - {name: Shield, type: select, proxies: [默认代理, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 手动选择, DIRECT, REJECT]}
  - {name: 漏网之鱼, type: select, proxies: [默认代理, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 手动选择, DIRECT]}
  - {name: 香港节点, type: url-test, use: [Airport1], filter: '(?i)(?:香港|HKG|HK|Hong[\s_-]*Kong)', tolerance: 20, interval: 600, lazy: true}
  - {name: 日本节点, type: url-test, use: [Airport1], filter: '(?i)(?:日本|日|JP|JPN|Japan)', tolerance: 20, interval: 600, lazy: true}
  - {name: 新加坡节点, type: url-test, use: [Airport1], filter: '(?i)(?:新加坡|新|SG|SGP|Singapore)', tolerance: 20, interval: 600, lazy: true}
  - {name: 台湾节点, type: url-test, use: [Airport1], filter: '(?i)(?:台湾|台灣|🇹🇼|\bTW\b|\bTWN\b|Taiwan|Taipei|TPE)', tolerance: 20, interval: 600, lazy: true}
  - {name: 美国节点, type: url-test, use: [Airport1], filter: '(?i)(?:美国|美|US|USA|United\\s*States|UnitedStates)', tolerance: 20, interval: 600, lazy: true}
  - {name: 手动选择, type: select, use: [Airport1]}

